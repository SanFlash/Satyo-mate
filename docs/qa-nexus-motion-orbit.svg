<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" fill="none" role="img" aria-labelledby="title desc">
<title id="title">QA Nexus — motion orbit</title>
<desc id="desc">A dark 3D quality-engineering core with four floating workflow nodes connected by an animated orbit, pulsing rings, and a moving light trail.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#080D1D"/><stop offset=".55" stop-color="#111936"/><stop offset="1" stop-color="#1B1240"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B7A9FF"/><stop offset="1" stop-color="#6955F5"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78EFFF"/><stop offset="1" stop-color="#2784CE"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#82F7C9"/><stop offset="1" stop-color="#16A77D"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#7D6BFF" stop-opacity=".3"/><stop offset="1" stop-color="#7D6BFF" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#9DB0FF" stroke-opacity=".075"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
<rect width="1200" height="540" rx="24" fill="url(#bg)"/><rect width="1200" height="540" rx="24" fill="url(#grid)"/>
<circle cx="600" cy="278" r="255" fill="url(#halo)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="48" y="52" font-size="12" font-weight="700" letter-spacing="3.5" fill="#A99BFF">QA NEXUS / QUALITY ENGINEERING IN MOTION</text>
 <text x="48" y="87" font-size="25" font-weight="700" fill="#F4F6FF">A continuous loop of better testing</text>
 <text x="48" y="111" font-size="13" fill="#9EAFD3">Turn knowledge into repeatable, maintainable automation.</text>
</g>
<!-- perspective platform -->
<path d="M180 280L600 120L1020 280L600 455Z" fill="#0B1532" stroke="#4C5FA8" stroke-opacity=".65"/>
<path d="M245 280L600 145L955 280L600 428Z" stroke="#3F5A9E" stroke-opacity=".45" stroke-dasharray="5 8"/>
<path d="M300 280L600 166L900 280L600 405Z" stroke="#5D64BC" stroke-opacity=".35"/>
<!-- animated elliptical orbit -->
<ellipse cx="600" cy="278" rx="360" ry="116" stroke="#7869FF" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="10 9" transform="rotate(-17 600 278)"/>
<ellipse cx="600" cy="278" rx="310" ry="83" stroke="#55DDF4" stroke-opacity=".35" stroke-width="1.2" transform="rotate(19 600 278)"/>
<ellipse cx="600" cy="278" rx="360" ry="116" stroke="#A89CFF" stroke-width="2.2" stroke-dasharray="45 680" stroke-linecap="round" transform="rotate(-17 600 278)"><animate attributeName="stroke-dashoffset" from="0" to="-725" dur="7s" repeatCount="indefinite"/></ellipse>
<circle r="5" fill="#8DF5FF" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M250 340 C360 120 835 105 950 250 C850 440 360 440 250 340"/></circle>
<circle r="3.5" fill="#8CF8CA" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M950 250 C835 105 360 120 250 340 C360 440 850 440 950 250"/></circle>
<!-- central 3D core -->
<ellipse cx="600" cy="324" rx="112" ry="30" fill="#000" opacity=".42" filter="url(#shadow)"/>
<g>
 <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/>
 <path d="M514 238L600 188L686 238L600 288Z" fill="#9E91FF" stroke="#D2C9FF" stroke-opacity=".85"/>
 <path d="M514 238L600 288V383L514 333Z" fill="url(#violet)" stroke="#B9AEFF"/>
 <path d="M600 288L686 238V333L600 383Z" fill="url(#blue)" stroke="#77E7FF"/>
 <path d="M535 241L600 203L665 241L600 279Z" stroke="#E9E5FF" stroke-opacity=".65"/>
 <path d="M545 258L600 290L655 258" stroke="#D9F8FF" stroke-opacity=".55"/>
 <g transform="translate(562 298)" stroke="#FFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0L-11 10L0 20"/><path d="M76 0L87 10L76 20"/><path d="M48 -3L28 23"/></g>
</g>
<!-- node connectors -->
<g stroke-width="1.6" stroke-dasharray="4 6" opacity=".8">
 <path d="M380 186L480 240" stroke="#A79AFF"/><path d="M820 185L719 239" stroke="#60DFF5"/>
 <path d="M380 385L485 330" stroke="#5BE6B4"/><path d="M820 385L715 330" stroke="#A79AFF"/>
</g>
<!-- floating nodes -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4.2s" repeatCount="indefinite"/>
  <path d="M245 166L355 166L391 187L281 187Z" fill="#15234A" stroke="#8D7BFF" stroke-opacity=".8"/>
  <rect x="245" y="130" width="146" height="48" rx="10" fill="#151F41" stroke="#8B7BFF"/>
  <circle cx="264" cy="154" r="8" fill="#8D7BFF" fill-opacity=".25" stroke="#B8ADFF"/><path d="M260 154L263 157L269 150" stroke="#D5D0FF" stroke-width="1.7" stroke-linecap="round"/>
  <text x="279" y="151" fill="#F1EFFF" font-size="12" font-weight="700">01 · LEARN</text><text x="279" y="165" fill="#AEB9DF" font-size="9">Explore concepts</text>
 </g>
 <g><animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="4.7s" repeatCount="indefinite"/>
  <path d="M810 166L920 166L955 187L845 187Z" fill="#102D43" stroke="#45CDEB" stroke-opacity=".8"/>
  <rect x="810" y="130" width="146" height="48" rx="10" fill="#10253C" stroke="#45CDEB"/>
  <circle cx="829" cy="154" r="8" fill="#45CDEB" fill-opacity=".18" stroke="#75E8FA"/><path d="M825 154H833M829 150V158" stroke="#B7F6FF" stroke-width="1.5" stroke-linecap="round"/>
  <text x="844" y="151" fill="#E9FCFF" font-size="12" font-weight="700">02 · DESIGN</text><text x="844" y="165" fill="#A8CBE0" font-size="9">Map test coverage</text>
 </g>
 <g><animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="4.5s" repeatCount="indefinite"/>
  <path d="M245 371L355 371L391 392L281 392Z" fill="#11362F" stroke="#4DE0AE" stroke-opacity=".8"/>
  <rect x="245" y="335" width="146" height="48" rx="10" fill="#102C2A" stroke="#4DE0AE"/>
  <circle cx="264" cy="359" r="8" fill="#4DE0AE" fill-opacity=".18" stroke="#70F2C5"/><path d="M260 359L263 362L269 355" stroke="#B9FFE4" stroke-width="1.7" stroke-linecap="round"/>
  <text x="279" y="356" fill="#E7FFF5" font-size="12" font-weight="700">03 · BUILD</text><text x="279" y="370" fill="#A6D9C8" font-size="9">Generate scaffolds</text>
 </g>
 <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.1s" repeatCount="indefinite"/>
  <path d="M810 371L920 371L955 392L845 392Z" fill="#28204A" stroke="#A18AFF" stroke-opacity=".8"/>
  <rect x="810" y="335" width="146" height="48" rx="10" fill="#211B3D" stroke="#A18AFF"/>
  <circle cx="829" cy="359" r="8" fill="#A18AFF" fill-opacity=".18" stroke="#C8BBFF"/><path d="M825 359L828 362L834 355" stroke="#E1D8FF" stroke-width="1.7" stroke-linecap="round"/>
  <text x="844" y="356" fill="#F2EDFF" font-size="12" font-weight="700">04 · PRACTICE</text><text x="844" y="370" fill="#C1B5E6" font-size="9">Review and run</text>
 </g>
</g>
<!-- ambient checkpoints -->
<g fill="#A99BFF"><circle cx="178" cy="245" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle><circle cx="1022" cy="304" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle><circle cx="704" cy="445" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle></g>
<text x="600" y="500" fill="#8195C4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing="3">QUALITY ENGINEERING IS A CONTINUOUS LOOP</text>
</svg>