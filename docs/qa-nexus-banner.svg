<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">QA Nexus animated hero</title><desc id="desc">Cinematic QA Nexus banner with neon Q, orbiting particles, floating robot, moving scanline and command prompt.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030615"/><stop offset=".48" stop-color="#101b43"/><stop offset="1" stop-color="#09051d"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36f6ff"/><stop offset=".48" stop-color="#6474ff"/><stop offset="1" stop-color="#e16dff"/></linearGradient>
<linearGradient id="green"><stop stop-color="#b7ff9b"/><stop offset="1" stop-color="#00c987"/></linearGradient><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#67dfff"/></linearGradient>
<linearGradient id="beam"><stop stop-color="#3ceeff" stop-opacity="0"/><stop offset=".5" stop-color="#3ceeff" stop-opacity=".3"/><stop offset="1" stop-color="#a86dff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8daaff" stroke-opacity=".08"/></pattern><clipPath id="clip"><rect width="1200" height="470" rx="28"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="1200" height="470" rx="28" fill="url(#bg)"/><rect width="1200" height="470" fill="url(#grid)"/>
<ellipse cx="260" cy="220" rx="240" ry="200" fill="#175cff" opacity=".08"><animate attributeName="rx" values="210;270;210" dur="7s" repeatCount="indefinite"/></ellipse><ellipse cx="900" cy="210" rx="350" ry="210" fill="#9b35ff" opacity=".07"><animate attributeName="ry" values="180;230;180" dur="8s" repeatCount="indefinite"/></ellipse>
<g stroke="#4feaff" stroke-opacity=".35" fill="none"><circle cx="250" cy="212" r="150" stroke-dasharray="2 13"><animateTransform attributeName="transform" type="rotate" from="0 250 212" to="360 250 212" dur="28s" repeatCount="indefinite"/></circle><ellipse cx="250" cy="212" rx="190" ry="86" transform="rotate(-28 250 212)" stroke-dasharray="4 12"><animateTransform attributeName="transform" type="rotate" from="-28 250 212" to="332 250 212" dur="19s" repeatCount="indefinite"/></ellipse></g>
<g fill="#a9f8ff" filter="url(#glow)"><circle cx="104" cy="103" r="2"><animate attributeName="cy" values="103;84;103" dur="3s" repeatCount="indefinite"/></circle><circle cx="385" cy="82" r="2"><animate attributeName="cx" values="385;410;385" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="410" cy="322" r="3"><animate attributeName="r" values="2;4;2" dur="1.9s" repeatCount="indefinite"/></circle><circle cx="720" cy="74" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="1120" cy="140" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="690" cy="390" r="2"><animate attributeName="cy" values="390;365;390" dur="4s" repeatCount="indefinite"/></circle></g>
<path d="M250 90a122 122 0 1 0 86 208l49 45" fill="none" stroke="url(#neon)" stroke-width="25" stroke-linecap="round" stroke-dasharray="740" stroke-dashoffset="740" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="740" to="0" dur="2.3s" fill="freeze"/></path>
<path d="M195 210l39 38 73-83" fill="none" stroke="url(#green)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="160" stroke-dashoffset="160" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="160" to="0" begin="1.9s" dur=".8s" fill="freeze"/></path>
<path d="M250 90a122 122 0 1 0 86 208l49 45" fill="none" stroke="#e5ffff" stroke-opacity=".45" stroke-width="2" stroke-dasharray="90 650"><animate attributeName="stroke-dashoffset" from="0" to="-740" dur="4s" repeatCount="indefinite"/></path>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -11;0 0" dur="3.2s" repeatCount="indefinite"/><g transform="translate(345 70) rotate(7)"><rect width="112" height="104" rx="34" fill="url(#shell)" stroke="#43e7ff" stroke-width="5"/><rect x="13" y="15" width="86" height="63" rx="24" fill="#07142f" stroke="#a2f4ff" stroke-width="3"/><path d="M32 43q8-12 16 0m18 0q8-12 16 0" stroke="#20efff" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M39 60q17 12 34 0" stroke="#7dffcb" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="56" cy="-8" r="8" fill="#38edff" stroke="#fff" stroke-width="3"/><path d="M20 100l-9 16m78-16l9 16" stroke="#4bdfff" stroke-width="8" stroke-linecap="round"/></g></g>
<g font-family="Arial,Helvetica,sans-serif"><text x="510" y="82" fill="#a4c6ff" font-size="18" font-weight="700" letter-spacing="8">YOUR QA AUTOMATION LAB</text><text x="502" y="161" fill="#f7fbff" font-size="75" font-weight="800" letter-spacing="-2">QA <tspan fill="#8ba2ff">NEXUS</tspan></text>
<rect x="510" y="184" width="570" height="3" rx="2" fill="#27365d"/><rect x="510" y="184" width="0" height="3" rx="2" fill="url(#neon)"><animate attributeName="width" values="0;570;570;0" keyTimes="0;.35;.8;1" dur="5s" repeatCount="indefinite"/></rect>
<text x="512" y="224" fill="#a8c4f4" font-size="19" letter-spacing="2">LEARN · PRACTICE · BUILD · AUTOMATE</text><text x="512" y="261" fill="#d9e4ff" font-size="17">Created by Satyendra Kumar Namdeo</text>
<g transform="translate(510 294)"><rect width="570" height="102" rx="14" fill="#060d22" fill-opacity=".95" stroke="#4c82ff" stroke-opacity=".8" stroke-width="1.5"/><path d="M0 32H570" stroke="#283a64"/><circle cx="18" cy="16" r="4" fill="#ff6b81"/><circle cx="32" cy="16" r="4" fill="#ffd36b"/><circle cx="46" cy="16" r="4" fill="#63efb2"/><text x="62" y="20" fill="#91a9d9" font-family="monospace" font-size="11">qanexus / automation-console</text><text x="17" y="56" fill="#39eaff" font-family="monospace" font-size="13">›</text><text x="34" y="56" fill="#c4d7ff" font-family="monospace" font-size="13">initializing QA workspace...</text><text x="17" y="80" fill="#39eaff" font-family="monospace" font-size="13">›</text><text x="34" y="80" fill="#c4d7ff" font-family="monospace" font-size="13">Playwright</text><text x="127" y="80" fill="#64ffb8" font-family="monospace" font-size="13">✓ ready</text><rect x="226" y="67" width="7" height="15" fill="#38eaff"><animate attributeName="opacity" values="1;0;1" dur=".75s" repeatCount="indefinite"/></rect></g></g>
<rect x="-500" y="0" width="300" height="470" fill="url(#beam)" opacity=".8" transform="skewX(-20)"><animate attributeName="x" values="-500;1500" dur="6s" repeatCount="indefinite"/></rect><path d="M0 432H1200" stroke="#6a82ff" stroke-opacity=".35"/><path d="M0 432H1200" stroke="url(#neon)" stroke-width="2" stroke-dasharray="120 1080"><animate attributeName="stroke-dashoffset" from="0" to="-1200" dur="5s" repeatCount="indefinite"/></path>
</g></svg>