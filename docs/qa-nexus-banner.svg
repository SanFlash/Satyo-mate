<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">QA Nexus — Learn, Practice, Build, Automate</title><desc id="desc">Animated neon QA Nexus banner with a drawing Q, floating robot and command prompt.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05091b"/><stop offset=".55" stop-color="#101c46"/><stop offset="1" stop-color="#08091e"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39f4ff"/><stop offset=".5" stop-color="#5677ff"/><stop offset="1" stop-color="#d36bff"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7ff8d"/><stop offset="1" stop-color="#00c879"/></linearGradient>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#72dfff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
 <g fill="#b3ecff" opacity=".7">
  <circle cx="95" cy="68" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="355" cy="330" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="730" cy="70" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="310" r="2"><animate attributeName="opacity" values=".1;.9;.1" dur="2.7s" repeatCount="indefinite"/></circle>
 </g>
 <circle cx="260" cy="210" r="128" fill="#091638" stroke="url(#neon)" stroke-width="17" stroke-dasharray="805" stroke-dashoffset="805" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" from="805" to="0" dur="2.5s" fill="freeze"/>
 </circle>
 <path d="M235 218l35 37 73-82" fill="none" stroke="url(#green)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="160" stroke-dashoffset="160" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" from="160" to="0" begin="1.8s" dur=".8s" fill="freeze"/>
 </path>
 <path d="M321 306q41 56 88 25-10 44-50 41-27-3-47-34" fill="none" stroke="url(#neon)" stroke-width="15" stroke-linecap="round">
  <animate attributeName="opacity" values=".65;1;.65" dur="2s" repeatCount="indefinite"/>
 </path>
 <g transform="translate(360 65)">
  <animateTransform attributeName="transform" type="translate" values="360 65;360 52;360 65" dur="3s" repeatCount="indefinite"/>
  <rect x="0" y="0" width="112" height="104" rx="34" fill="url(#shell)" stroke="#43e7ff" stroke-width="5"/>
  <rect x="13" y="15" width="86" height="63" rx="24" fill="#07142f" stroke="#a2f4ff" stroke-width="3"/>
  <path d="M32 43q8-12 16 0m18 0q8-12 16 0" stroke="#20efff" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M39 60q17 12 34 0" stroke="#7dffcb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="56" cy="-8" r="8" fill="#38edff" stroke="#fff" stroke-width="3"/>
 </g>
 <g transform="translate(520 95)">
  <text x="0" y="0" fill="#eff6ff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="7">WELCOME TO</text>
  <text x="-3" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="800" letter-spacing="1">QA <tspan fill="#78a1ff">NEXUS</tspan></text>
  <rect x="0" y="105" width="430" height="3" rx="2" fill="url(#neon)"><animate attributeName="width" values="0;430" dur="1.6s" fill="freeze"/></rect>
  <text x="0" y="147" fill="#9eb9ee" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="2">LEARN · PRACTICE · BUILD · AUTOMATE</text>
  <text x="0" y="197" fill="#d5def5" font-family="Arial,Helvetica,sans-serif" font-size="17">Created by Satyendra Kumar Namdeo</text>
 </g>
 <g transform="translate(840 270)">
  <animateTransform attributeName="transform" type="translate" values="840 270;840 262;840 270" dur="3.4s" repeatCount="indefinite"/>
  <rect width="300" height="92" rx="13" fill="#08132d" stroke="#4f8fff" stroke-width="2"/>
  <path d="M0 28H300" stroke="#283c67" stroke-width="2"/>
  <circle cx="17" cy="14" r="4" fill="#ff6f80"/><circle cx="31" cy="14" r="4" fill="#ffd16c"/><circle cx="45" cy="14" r="4" fill="#61edb0"/>
  <text x="61" y="18" fill="#9eb5df" font-family="monospace" font-size="10">qanexus / automation</text>
  <text x="16" y="51" fill="#40eaff" font-family="monospace" font-size="12">›</text>
  <text x="31" y="51" fill="#c1d6ff" font-family="monospace" font-size="12">Playwright</text>
  <text x="117" y="51" fill="#6dffb9" font-family="monospace" font-size="12">✓ ready</text>
  <rect x="16" y="65" width="7" height="12" fill="#35eaff"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
 </g>
 <path d="M55 380H460" stroke="#6d8bff" stroke-opacity=".2"/><path d="M55 380H270" stroke="url(#neon)" stroke-width="2"><animate attributeName="stroke-dasharray" values="0 405;405 0" dur="3s" repeatCount="indefinite"/></path>
</svg>