<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" fill="none" role="img" aria-labelledby="title desc">
<title id="title">QA Nexus — the animated isometric automation lab</title>
<desc id="desc">A dark futuristic QA workspace with an isometric floating dashboard, rotating automation cube, animated circuit paths, glowing status lights, and tool panels.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#080D1D"/><stop offset=".52" stop-color="#101737"/><stop offset="1" stop-color="#1C1240"/></linearGradient>
 <linearGradient id="glass" x1="250" y1="120" x2="950" y2="570" gradientUnits="userSpaceOnUse"><stop stop-color="#1B2D55" stop-opacity=".96"/><stop offset="1" stop-color="#11162F" stop-opacity=".96"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A99BFF"/><stop offset="1" stop-color="#6555ED"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6CF4FF"/><stop offset="1" stop-color="#268DDC"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77F7C1"/><stop offset="1" stop-color="#20B889"/></linearGradient>
 <linearGradient id="cubeFront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#786AFF"/><stop offset="1" stop-color="#3B3B9B"/></linearGradient>
 <linearGradient id="cubeSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2B8EBA"/><stop offset="1" stop-color="#17456D"/></linearGradient>
 <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B5A8FF"/><stop offset="1" stop-color="#7064D9"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#7D6BFF" stop-opacity=".4"/><stop offset="1" stop-color="#7D6BFF" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#8DA8FF" stroke-opacity=".08" stroke-width="1"/></pattern>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="680" rx="26" fill="url(#bg)"/>
<rect width="1200" height="680" rx="26" fill="url(#grid)"/>
<circle cx="600" cy="325" r="340" fill="url(#glow)"/>
<g opacity=".75" stroke="#6C84FF" stroke-width="1">
 <path d="M0 500L300 340L600 510L900 340L1200 500" opacity=".18"/>
 <path d="M0 560L300 400L600 570L900 400L1200 560" opacity=".13"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="56" y="62" fill="#A99BFF" font-size="13" font-weight="700" letter-spacing="4">QA NEXUS / AUTOMATION LAB</text>
 <text x="56" y="105" fill="#F4F6FF" font-size="31" font-weight="700">From test idea to a stronger framework.</text>
 <text x="57" y="132" fill="#A5B3D8" font-size="14">Explore concepts. Design coverage. Build reusable automation.</text>
 <g transform="translate(57 164)">
  <rect width="156" height="34" rx="17" fill="#8B7BFF" fill-opacity=".14" stroke="#9B8BFF" stroke-opacity=".55"/>
  <circle cx="17" cy="17" r="4" fill="#8C7CFF"/><text x="30" y="21" fill="#D6D0FF" font-size="11" font-weight="600">INTERACTIVE LEARNING</text>
 </g>
</g>
<!-- floating platform -->
<ellipse cx="606" cy="484" rx="310" ry="72" fill="#050817" opacity=".7" filter="url(#shadow)"/>
<g opacity=".7" stroke="#7A8CFF" stroke-width="1.3" stroke-dasharray="7 10">
 <path d="M260 418L460 530L760 357L955 470"/>
 <path d="M300 355L500 468L800 295L1000 407"/>
</g>
<g stroke-linejoin="round">
 <path d="M280 358L603 171L928 358L606 548Z" fill="#0D1838" stroke="#5267B7" stroke-opacity=".65"/>
 <path d="M280 358L606 548V578L280 389Z" fill="#101A3B" stroke="#34467E"/>
 <path d="M606 548L928 358V388L606 578Z" fill="#141437" stroke="#4C438B"/>
 <path d="M320 359L603 196L888 359L606 523Z" fill="#101C3D" stroke="#5B6FD0" stroke-opacity=".6"/>
</g>
<!-- isometric dashboard panel -->
<g transform="translate(310 205)">
 <path d="M0 64L289 -103L580 64L290 232Z" fill="#070C1E" opacity=".6" transform="translate(0 18)"/>
 <path d="M0 50L289 -117L580 50L290 217Z" fill="url(#glass)" stroke="#6379D0" stroke-opacity=".8" stroke-width="1.5"/>
 <path d="M0 50L290 217V237L0 70Z" fill="#182447" stroke="#475DA4"/>
 <path d="M290 217L580 50V70L290 237Z" fill="#1B1B47" stroke="#5A4AA8"/>
 <path d="M0 50L289 -117L580 50L290 217Z" fill="url(#grid)" opacity=".7"/>
 <!-- card 1 -->
 <path d="M38 48L139 -10L235 45L134 103Z" fill="#19264A" stroke="#6077C5" stroke-opacity=".65"/>
 <path d="M58 47L136 2" stroke="#8F83FF" stroke-width="4" stroke-linecap="round"/>
 <path d="M58 61L120 25" stroke="#7489C6" stroke-width="3" stroke-linecap="round"/>
 <path d="M58 74L105 47" stroke="#7489C6" stroke-width="3" stroke-linecap="round"/>
 <circle cx="207" cy="46" r="17" fill="#28C995" fill-opacity=".14" stroke="#4DE4B2"/>
 <path d="M199 46L205 52L216 39" stroke="#75F4C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- card 2 -->
 <path d="M265 -24L366 -82L464 -26L363 32Z" fill="#19264A" stroke="#5D8BC4" stroke-opacity=".65"/>
 <path d="M288 -23L352 -60L352 -39L288 -2Z" fill="#5B4ED0"/>
 <path d="M360 -65L434 -22L434 -1L360 -44Z" fill="#1F83B8"/>
 <path d="M288 2L352 -35" stroke="#8B7CFF" stroke-width="3" stroke-linecap="round"/>
 <!-- card 3 -->
 <path d="M143 125L244 67L342 124L241 182Z" fill="#162449" stroke="#6278C7" stroke-opacity=".65"/>
 <path d="M171 125L211 102L211 126L171 149Z" fill="#8B7BFF"/>
 <path d="M221 96L302 142" stroke="#43DDB2" stroke-width="4" stroke-linecap="round"/>
 <path d="M221 111L284 147" stroke="#7085C4" stroke-width="3" stroke-linecap="round"/>
 <!-- tiny UI bars -->
 <path d="M385 93L445 58M385 106L468 58M385 119L430 93" stroke="#7185C8" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- 3D automation cube -->
<g>
 <ellipse cx="608" cy="378" rx="84" ry="25" fill="#7162FF" opacity=".28" filter="url(#shadow)"/>
 <g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="4.5s" repeatCount="indefinite"/>
  <path d="M530 301L602 260L674 301L602 343Z" fill="url(#cubeTop)" stroke="#C8C0FF" stroke-width="1.5"/>
  <path d="M530 301L602 343V425L530 383Z" fill="url(#cubeFront)" stroke="#A69BFF" stroke-width="1.5"/>
  <path d="M602 343L674 301V383L602 425Z" fill="url(#cubeSide)" stroke="#6ADAF3" stroke-width="1.5"/>
  <path d="M551 310L602 281L653 310L602 339Z" stroke="#E3DFFF" stroke-opacity=".55" fill="none"/>
  <path d="M554 325L602 353L650 325" stroke="#D7D2FF" stroke-opacity=".5" fill="none"/>
  <g transform="translate(564 347)" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0L12 10L0 20"/><path d="M19 20H38"/></g>
  <g transform="translate(616 343)" stroke="#BDF7FF" stroke-width="3" stroke-linecap="round"><path d="M0 0L10 10L0 20"/></g>
 </g>
</g>
<!-- orbiting path and moving particle -->
<ellipse cx="608" cy="342" rx="130" ry="52" stroke="#70E8FF" stroke-opacity=".5" stroke-width="1.4" transform="rotate(-25 608 342)" stroke-dasharray="6 8"/>
<circle r="5" fill="#7DF4FF" filter="url(#softGlow)"><animateMotion dur="6s" repeatCount="indefinite" path="M478 392 C535 270 685 270 738 330 C684 414 538 425 478 392"/></circle>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <!-- left floating tool tile -->
 <g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5s" repeatCount="indefinite"/>
  <path d="M96 317L178 270L261 317L179 365Z" fill="#121F41" stroke="#5D74C5"/>
  <path d="M96 317L179 365V382L96 334Z" fill="#182449" stroke="#3E5597"/>
  <path d="M179 365L261 317V334L179 382Z" fill="#1A1B43" stroke="#514A9A"/>
  <circle cx="179" cy="315" r="22" fill="#8272FF" fill-opacity=".18" stroke="#9B8DFF"/>
  <path d="M170 309L162 315L170 321M188 309L196 315L188 321M183 305L175 325" stroke="#C9C1FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="179" y="347" fill="#DDE3FF" font-size="10" text-anchor="middle" font-weight="700">PLAYWRIGHT</text>
 </g>
 <!-- right floating tool tile -->
 <g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="5.8s" repeatCount="indefinite"/>
  <path d="M842 306L924 259L1007 306L925 354Z" fill="#121F41" stroke="#47A9CB"/>
  <path d="M842 306L925 354V371L842 323Z" fill="#182449" stroke="#3E5597"/>
  <path d="M925 354L1007 306V323L925 371Z" fill="#12304A" stroke="#287DA5"/>
  <circle cx="925" cy="303" r="22" fill="#39C6E6" fill-opacity=".13" stroke="#53DDF5"/>
  <rect x="913" y="291" width="24" height="24" rx="4" stroke="#83EEFF" stroke-width="2"/>
  <path d="M918 297H932M918 303H932M918 309H927" stroke="#83EEFF" stroke-width="2" stroke-linecap="round"/>
  <text x="925" y="338" fill="#DDF8FF" font-size="10" text-anchor="middle" font-weight="700">SELENIUM</text>
 </g>
 <!-- status chips -->
 <g transform="translate(840 150)">
  <rect width="250" height="52" rx="12" fill="#111B37" stroke="#3C507F"/>
  <circle cx="23" cy="26" r="6" fill="#54E6B3"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="40" y="23" fill="#E9EEFF" font-size="12" font-weight="700">TEST WORKFLOW</text>
  <text x="40" y="38" fill="#9FAFD3" font-size="10">Learn → Design → Build → Practice</text>
  <path d="M217 20L224 27L237 13" stroke="#62EDB8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
 <!-- decorative floating particles -->
 <g fill="#A89CFF"><circle cx="283" cy="210" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="1005" cy="438" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="755" cy="220" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="354" cy="469" r="2.5"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle></g>
 <g fill="#6DEBFF"><circle cx="755" cy="474" r="2.5"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle><circle cx="453" cy="186" r="2"><animate attributeName="opacity" values="1;.3;1" dur="3.2s" repeatCount="indefinite"/></circle></g>
 <text x="600" y="635" fill="#8598C7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle" letter-spacing="3">QUALITY ENGINEERING · BUILT TO EXPLORE</text>
</g>
</svg>