<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" fill="none" role="img" aria-labelledby="title desc">
<title id="title">QA Nexus Nebula Engine — animated workflow visualization</title>
<desc id="desc">A dramatic dark sci-fi QA engine with a 3D quality cube, holographic floating panels, rotating orbital rings, moving energy trails, scanning beams and glowing workflow nodes.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="740" gradientUnits="userSpaceOnUse"><stop stop-color="#050815"/><stop offset=".5" stop-color="#101632"/><stop offset="1" stop-color="#21103C"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D6CEFF"/><stop offset=".45" stop-color="#8978FF"/><stop offset="1" stop-color="#4935C5"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B7FCFF"/><stop offset=".5" stop-color="#49D9F5"/><stop offset="1" stop-color="#176DAF"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A1FFDA"/><stop offset="1" stop-color="#11A67B"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22325C" stop-opacity=".95"/><stop offset="1" stop-color="#0B122A" stop-opacity=".92"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#7E65FF" stop-opacity=".48"/><stop offset=".48" stop-color="#3D3C9D" stop-opacity=".16"/><stop offset="1" stop-color="#070B1B" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#8BA4FF" stroke-opacity=".08"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="deepShadow" x="-70%" y="-70%" width="240%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
 <clipPath id="frame"><rect width="1200" height="740" rx="24"/></clipPath>
</defs>
<g clip-path="url(#frame)">
 <rect width="1200" height="740" fill="url(#bg)"/><rect width="1200" height="740" fill="url(#grid)"/>
 <circle cx="600" cy="366" r="420" fill="url(#nebula)"><animate attributeName="r" values="350;440;350" dur="9s" repeatCount="indefinite"/></circle>
 <!-- header -->
 <g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="54" y="55" font-size="12" font-weight="700" letter-spacing="4" fill="#B4A7FF">QA NEXUS / THE QUALITY ENGINE</text>
  <text x="54" y="101" font-size="32" font-weight="750" letter-spacing="-1" fill="#F7F8FF">Turn uncertainty into</text>
  <text x="54" y="139" font-size="32" font-weight="750" letter-spacing="-1" fill="#A99AFF">verifiable confidence.</text>
  <text x="56" y="168" font-size="13" fill="#A7B5D7">A visual map from QA knowledge to structured test automation.</text>
 </g>
 <!-- 3D circuit deck -->
 <ellipse cx="603" cy="527" rx="366" ry="74" fill="#02040D" opacity=".7" filter="url(#deepShadow)"/>
 <path d="M205 406L601 176L1000 406L604 638Z" fill="#0B1531" stroke="#6477D2" stroke-opacity=".7"/>
 <path d="M205 406L604 638V666L205 434Z" fill="#121B3B" stroke="#354A89"/>
 <path d="M604 638L1000 406V434L604 666Z" fill="#1A153B" stroke="#57479D"/>
 <path d="M265 406L601 212L940 406L604 601Z" fill="url(#panel)" stroke="#5369B9" stroke-opacity=".6"/>
 <path d="M265 406L604 601L940 406" stroke="#7588E9" stroke-opacity=".25"/>
 <!-- circuit routes -->
 <g stroke-width="1.5" stroke-dasharray="5 8" opacity=".8">
  <path d="M300 406L412 341L500 392" stroke="#9B8CFF"/><path d="M901 406L788 340L704 390" stroke="#5BE5F8"/>
  <path d="M406 487L494 436L536 460" stroke="#4DE2B0"/><path d="M801 484L712 433L672 458" stroke="#9B8CFF"/>
 </g>
 <path d="M270 406L604 601L938 406" stroke="#59DFF5" stroke-width="2" stroke-opacity=".6" stroke-dasharray="2 16" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-90" dur="1.8s" repeatCount="indefinite"/></path>
 <!-- orbit rings -->
 <ellipse cx="604" cy="393" rx="324" ry="116" stroke="#8B7AFF" stroke-width="1.4" stroke-opacity=".8" stroke-dasharray="7 10" transform="rotate(-21 604 393)"/>
 <ellipse cx="604" cy="393" rx="272" ry="83" stroke="#55E1F7" stroke-width="1.2" stroke-opacity=".5" stroke-dasharray="3 9" transform="rotate(23 604 393)"/>
 <ellipse cx="604" cy="393" rx="324" ry="116" stroke="#D2C9FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="46 770" transform="rotate(-21 604 393)"><animate attributeName="stroke-dashoffset" from="0" to="-816" dur="5.8s" repeatCount="indefinite"/></ellipse>
 <circle r="5" fill="#B3FBFF" filter="url(#glow)"><animateMotion dur="5.8s" repeatCount="indefinite" path="M293 508 C370 260 826 250 916 369 C1005 488 590 589 293 508"/></circle>
 <circle r="4" fill="#9DFFDB" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M916 369 C826 250 370 260 293 508 C590 589 1005 488 916 369"/></circle>
 <circle r="3" fill="#B6A6FF" filter="url(#glow)"><animateMotion dur="4.5s" repeatCount="indefinite" path="M340 380 C465 245 742 260 858 408 C740 515 455 540 340 380"/></circle>
 <!-- center cube -->
 <ellipse cx="604" cy="488" rx="122" ry="36" fill="#7965FF" opacity=".35" filter="url(#deepShadow)"/>
 <g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -13;0 0" dur="4.1s" repeatCount="indefinite"/>
  <path d="M499 342L604 281L709 342L604 403Z" fill="url(#violet)" stroke="#DAD2FF" stroke-width="1.5"/>
  <path d="M499 342L604 403V527L499 466Z" fill="#5A49D1" stroke="#AFA2FF" stroke-width="1.5"/>
  <path d="M604 403L709 342V466L604 527Z" fill="url(#cyan)" stroke="#A0F3FF" stroke-width="1.5"/>
  <path d="M523 344L604 297L685 344L604 390Z" stroke="#F4F0FF" stroke-opacity=".72"/>
  <path d="M524 369L604 416L684 369" stroke="#DFFBFF" stroke-opacity=".48"/>
  <g transform="translate(558 420)" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0L-12 13L0 26"/><path d="M92 0L104 13L92 26"/><path d="M63 -4L34 30"/></g>
  <circle cx="604" cy="281" r="5" fill="#FFF" filter="url(#glow)"/>
 </g>
 <!-- left holographic panel -->
 <g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
  <path d="M72 318L190 249L309 318L191 387Z" fill="#060B1C" opacity=".5"/>
  <path d="M72 295L191 226L309 295L191 364Z" fill="url(#panel)" stroke="#8E7DFF" stroke-width="1.4"/>
  <path d="M72 295L191 364V382L72 313Z" fill="#172449" stroke="#4A5BA4"/>
  <path d="M191 364L309 295V313L191 382Z" fill="#211B4B" stroke="#6757B8"/>
  <circle cx="191" cy="291" r="23" fill="#8C7BFF" fill-opacity=".18" stroke="#B5A9FF"/>
  <path d="M179 287L188 296L204 279" stroke="#E0DAFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="191" y="330" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#F0EDFF" text-anchor="middle">TEST DESIGN</text>
 </g>
 <!-- right holographic panel -->
 <g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0" dur="5.6s" repeatCount="indefinite"/>
  <path d="M893 318L1011 249L1130 318L1011 387Z" fill="#060B1C" opacity=".5"/>
  <path d="M893 295L1011 226L1130 295L1011 364Z" fill="url(#panel)" stroke="#49D9F4" stroke-width="1.4"/>
  <path d="M893 295L1011 364V382L893 313Z" fill="#142847" stroke="#3E729D"/>
  <path d="M1011 364L1130 295V313L1011 382Z" fill="#11304A" stroke="#2D8AB0"/>
  <rect x="991" y="269" width="40" height="34" rx="5" fill="#51DDF5" fill-opacity=".16" stroke="#83EFFF"/>
  <path d="M1000 278H1022M1000 285H1022M1000 292H1015" stroke="#BDF8FF" stroke-width="2" stroke-linecap="round"/>
  <text x="1011" y="330" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#E5FCFF" text-anchor="middle">FRAMEWORK</text>
 </g>
 <!-- top status panel -->
 <g transform="translate(817 184)">
  <rect width="300" height="66" rx="12" fill="#080F25" stroke="#4E639F"/>
  <circle cx="22" cy="23" r="5" fill="#70F5BF"><animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
  <text x="38" y="27" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F0F4FF">QUALITY SIGNAL</text>
  <text x="22" y="47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#A7B8DE">Discover → Design → Build → Verify</text>
  <path d="M264 19L271 26L283 12" stroke="#7AF7C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 58H280" stroke="#5B6DAA" stroke-opacity=".35"/>
  <path d="M18 58H90" stroke="#6DE9FF" stroke-width="2"><animate attributeName="stroke-dasharray" values="0 270;95 175;0 270" dur="3.5s" repeatCount="indefinite"/></path>
 </g>
 <!-- bottom mini panels -->
 <g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(332 540)">
   <rect width="166" height="45" rx="9" fill="#0B172B" stroke="#39BFA1" stroke-opacity=".8"/>
   <circle cx="17" cy="22" r="4" fill="#58EDB5"><animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/></circle>
   <text x="29" y="19" font-size="10" font-weight="700" fill="#DBFFF0">ASSERTION</text><text x="29" y="32" font-size="9" fill="#90CDB9">Expected result check</text>
  </g>
  <g transform="translate(709 540)">
   <rect width="166" height="45" rx="9" fill="#11152F" stroke="#8878FF" stroke-opacity=".8"/>
   <circle cx="17" cy="22" r="4" fill="#A89AFF"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
   <text x="29" y="19" font-size="10" font-weight="700" fill="#EEE9FF">REUSABLE POM</text><text x="29" y="32" font-size="9" fill="#B2AADF">Maintainable scaffolds</text>
  </g>
 </g>
 <!-- scanning beams -->
 <path d="M75 605L1125 605" stroke="#7E73FF" stroke-opacity=".18"/>
 <path d="M75 605L260 605" stroke="#8F80FF" stroke-width="2" stroke-linecap="round"><animate attributeName="x1" values="75;930;75" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="260;1125;260" dur="6s" repeatCount="indefinite"/></path>
 <path d="M75 615L1125 615" stroke="#58DDF6" stroke-opacity=".12"/>
 <path d="M75 615L260 615" stroke="#58DDF6" stroke-width="1.5" stroke-linecap="round"><animate attributeName="x1" values="900;75;900" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="1085;260;1085" dur="7s" repeatCount="indefinite"/></path>
 <!-- ambient particles -->
 <g fill="#B2A4FF"><circle cx="393" cy="243" r="3"><animate attributeName="opacity" values=".15;1;.15" dur="2s" repeatCount="indefinite"/></circle><circle cx="769" cy="277" r="2.5"><animate attributeName="opacity" values="1;.15;1" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="761" cy="493" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="391" cy="492" r="2.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle></g>
 <g fill="#74EEFF"><circle cx="275" cy="185" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.3s" repeatCount="indefinite"/></circle><circle cx="1000" cy="184" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle></g>
 <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="687" fill="#B4C0E3" font-size="11" letter-spacing="3.5">QUALITY IS NOT A GUESS. IT IS ENGINEERED.</text>
  <text x="600" y="711" fill="#6579B1" font-size="9" letter-spacing="2.5">QA NEXUS · LEARN / DESIGN / BUILD / VERIFY</text>
 </g>
</g>
</svg>