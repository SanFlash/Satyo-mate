<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
<title id="t">The QA Nexus workflow</title><desc id="d">Four connected neon cards: Learn, Design, Build, Practice.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e22"/><stop offset="1" stop-color="#121d43"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#37e8ff"/><stop offset=".5" stop-color="#8d78ff"/><stop offset="1" stop-color="#61ffba"/></linearGradient></defs>
<rect width="1200" height="280" rx="24" fill="url(#bg)"/>
<path d="M180 123H1020" stroke="#34466e" stroke-width="4" stroke-linecap="round"/><path d="M180 123H1020" stroke="url(#line)" stroke-width="3" stroke-dasharray="20 16"><animate attributeName="stroke-dashoffset" from="0" to="-144" dur="4s" repeatCount="indefinite"/></path>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <g transform="translate(150 123)"><circle r="57" fill="#0e2442" stroke="#37e8ff" stroke-width="2"><animate attributeName="r" values="55;59;55" dur="2.5s" repeatCount="indefinite"/></circle><text y="-6" font-size="30" fill="#42eaff">01</text><text y="23" font-size="14" fill="#dcecff">LEARN</text><text y="91" font-size="15" fill="#9cb6e8">Explore a concept</text></g>
 <g transform="translate(450 123)"><circle r="57" fill="#191c44" stroke="#8d78ff" stroke-width="2"><animate attributeName="r" values="57;53;57" dur="2.8s" repeatCount="indefinite"/></circle><text y="-6" font-size="30" fill="#b3a0ff">02</text><text y="23" font-size="14" fill="#eee7ff">DESIGN</text><text y="91" font-size="15" fill="#9cb6e8">Plan test coverage</text></g>
 <g transform="translate(750 123)"><circle r="57" fill="#102c36" stroke="#39d9ee" stroke-width="2"><animate attributeName="r" values="55;59;55" dur="2.6s" repeatCount="indefinite"/></circle><text y="-6" font-size="30" fill="#53efff">03</text><text y="23" font-size="14" fill="#dcfbff">BUILD</text><text y="91" font-size="15" fill="#9cb6e8">Generate starter code</text></g>
 <g transform="translate(1050 123)"><circle r="57" fill="#10322d" stroke="#61ffba" stroke-width="2"><animate attributeName="r" values="57;53;57" dur="3s" repeatCount="indefinite"/></circle><text y="-6" font-size="30" fill="#61ffba">04</text><text y="23" font-size="14" fill="#e0fff1">PRACTICE</text><text y="91" font-size="15" fill="#9cb6e8">Review and run locally</text></g>
</g></svg>