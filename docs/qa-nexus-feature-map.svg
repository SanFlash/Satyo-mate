<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">QA Nexus animated workflow</title><desc id="d">Four glowing nodes animate to show Learn, Design, Build and Practice.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05091b"/><stop offset=".5" stop-color="#121e45"/><stop offset="1" stop-color="#09071d"/></linearGradient><linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39efff"/><stop offset=".5" stop-color="#9b79ff"/><stop offset="1" stop-color="#5effb8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="340" rx="24" fill="url(#bg)"/><g stroke="#9db7ff" stroke-opacity=".07"><path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200M0 320H1200"/></g><path d="M140 135H1060" stroke="#283b67" stroke-width="4" stroke-linecap="round"/><path d="M140 135H1060" stroke="url(#path)" stroke-width="3" stroke-dasharray="24 14" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-152" dur="3s" repeatCount="indefinite"/></path><circle r="7" fill="#e9ffff" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M140 135H1060"/></circle><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g transform="translate(140 135)"><circle r="66" fill="#0c2440" stroke="#38efff" stroke-width="2"><animate attributeName="r" values="63;68;63" dur="2.5s" repeatCount="indefinite"/></circle><circle r="51" fill="none" stroke="#38efff" stroke-opacity=".25" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></circle><text y="-7" font-size="31" font-weight="700" fill="#5bf1ff">01</text><text y="21" font-size="15" font-weight="700" fill="#fff">LEARN</text><text y="108" font-size="16" fill="#b3c7ef">Explore a concept</text></g><g transform="translate(447 135)"><circle r="66" fill="#1b1a43" stroke="#a38aff" stroke-width="2"><animate attributeName="r" values="66;61;66" dur="2.8s" repeatCount="indefinite"/></circle><circle r="51" fill="none" stroke="#a38aff" stroke-opacity=".25" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/></circle><text y="-7" font-size="31" font-weight="700" fill="#bba7ff">02</text><text y="21" font-size="15" font-weight="700" fill="#fff">DESIGN</text><text y="108" font-size="16" fill="#b3c7ef">Plan test coverage</text></g><g transform="translate(753 135)"><circle r="66" fill="#102b37" stroke="#39d9ee" stroke-width="2"><animate attributeName="r" values="63;68;63" dur="2.6s" repeatCount="indefinite"/></circle><circle r="51" fill="none" stroke="#39d9ee" stroke-opacity=".25" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></circle><text y="-7" font-size="31" font-weight="700" fill="#55eaff">03</text><text y="21" font-size="15" font-weight="700" fill="#fff">BUILD</text><text y="108" font-size="16" fill="#b3c7ef">Generate starter code</text></g><g transform="translate(1060 135)"><circle r="66" fill="#10312c" stroke="#5dffb9" stroke-width="2"><animate attributeName="r" values="66;61;66" dur="3s" repeatCount="indefinite"/></circle><circle r="51" fill="none" stroke="#5dffb9" stroke-opacity=".25" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/></circle><text y="-7" font-size="31" font-weight="700" fill="#68ffc2">04</text><text y="21" font-size="15" font-weight="700" fill="#fff">PRACTICE</text><text y="108" font-size="16" fill="#b3c7ef">Review and run locally</text></g></g><text x="600" y="290" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#90a9dc" text-anchor="middle" letter-spacing="3">FROM CONCEPT TO AUTOMATION — ONE STEP AT A TIME</text></svg>